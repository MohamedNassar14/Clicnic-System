name: Deploy Angular to Hostinger

on:
  push:
    branches:
      - main # اسم الفرع الأساسي لديك

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22.23.3' # أو الإصدار الذي تستخدمه

    - name: Install dependencies
      run: npm ci

    - name: Build Angular Project
      run: npm run build -- --configuration production

    - name: Deploy via FTP
      uses: SamKirsch/ftp-deploy-action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: dist/clinic-demo/browser/ # استبدل your-app-name باسم مشروعك داخل angular.json
        server-dir: /public_html/