
name: Deploy Angular to Hostinger

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

            - name: Build Angular Project
        run: npm run build -- --configuration production

      - name: Prepare index.html
        run: |
          if [ -f dist/clinic-demo/browser/index.csr.html ]; then
            cp dist/clinic-demo/browser/index.csr.html dist/clinic-demo/browser/index.html
            rm dist/clinic-demo/browser/index.csr.html
          fi

      - name: Verify build output
        run: ls -la dist/clinic-demo/browser/

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/clinic-demo/browser/
          server-dir: /public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/clinic-demo/browser/
          server-dir: /public_html/
