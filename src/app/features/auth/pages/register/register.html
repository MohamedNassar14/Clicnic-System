<section class="flex justify-center items-center gap-14 bg-[#F2F2F2] px-6 py-4 lg:px-14 lg:py-6 h-[100vh]">
    <div class="absolute top-9 right-9 w-[340px] h-[340px] bg-[rgba(5,98,140,0.4)] blur-3xl rounded-bl-full"></div>
    <div class="info w-full lg:w-1/2 flex justify-center relative z-10">
        <div class="content w-full lg:w-5/6 flex flex-col">
            <form class="flex flex-col gap-8" [formGroup]="registerForm" (ngSubmit)="onSubmitData()">
                <div class="head flex justify-center items-center gap-4 lg:mt-3">
                    <h2 class="text-[22px] lg:text-[32px] font-bold text-black">مرحبا بك في </h2>
                    <div class="flex items-center gap-x-2 mt-1">
                        <span class="text-[22px] lg:text-3xl font-bold text-[#0f172a]">Flow<span
                                class="text-[#1A5CFF]">Care</span></span>
                        <svg class="w-[30px] lg:w-[40px]"  viewBox="0 0 24 24" fill="none" stroke="#1A5CFF" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                            </path>
                            <path d="M3.5 12h4l2-4 3 8 2-5 1.5 3h4.5"></path>
                        </svg>
                    </div>
                </div>
                <div class="form-content flex flex-col gap-6">
                    <div class="name w-full flex flex-col gap-2">
                            <label class="text-sm text-[#333333] font-normal">الاسم بالكامل</label>
                            <input type="text" formControlName="name"
                                class="w-full p-3 border border-[#F1F1F1] rounded-lg placeholder:text-base placeholder:text-[#B3B3B3] placeholder:font-normal focus:outline-none"
                                placeholder="الاسم بالكامل" />
                            @if (isInvalid('name')) {
                            <p class="text-red-500 text-sm">يرجى إدخال الاسم بالكامل</p>
                            }
                    </div>
                    <div class="address w-full flex flex-col gap-2">
                            <label class="text-sm text-[#333333] font-normal">العنوان</label>
                            <input type="text" formControlName="address"
                                class="w-full p-3 border border-[#F1F1F1] rounded-lg placeholder:text-base placeholder:text-[#B3B3B3] placeholder:font-normal focus:outline-none"
                                placeholder="العنوان" />
                            @if (isInvalid('address')) {
                            <p class="text-red-500 text-sm">يرجى إدخال العنوان</p>
                            }
                    </div>
                    <div class="gender w-full flex flex-col gap-2">
                            <label class="text-sm text-[#333333] font-normal">النوع</label>
                            <p-select formControlName="gender" [options]="allGender" optionLabel="name" optionValue="id"
                                placeholder="اختر النوع"/>
                            @if (isInvalid('gender')) {
                            <p class="text-red-500 text-sm">يرجى إدخال نوع الجنس</p>
                            }
                    </div>
                    <div class="date-of-birth w-full flex flex-col gap-2">
                            <label class="text-sm text-[#333333] font-normal">تاريخ الميلاد</label>
                            <p-datepicker formControlName="date_of_birth" [iconDisplay]="'input'" [showIcon]="true"
                                inputId="icondisplay" styleClass="w-full"
                                panelStyleClass="custom-calendar-panel" placeholder="تاريخ الميلاد"></p-datepicker>
                            @if (isInvalid('date_of_birth')) {
                            <p class="text-red-500 text-sm">يرجى إدخال تاريخ الميلاد</p>
                            }
                    </div>
                </div>
                <button class="w-full rounded-lg py-2.5 px-3 bg-[#1053fc] text-white" type="submit" [disabled]="registerForm.invalid || isLoading()">
                    @if (!isLoading()) {
                    <span>إنشاء الحساب</span>
                    } @else {
                    <span class="loading-content">
                        <span>جارٍ إنشاء الحساب...</span>
                        <span class="loading-spinner" aria-hidden="true"></span>
                    </span>
                    }
                </button>
            </form>
        </div>
    </div>
    <div class="hidden lg:block image w-1/2 relative z-10">
        <img src="assets/images/banner2.jpg" alt="Wajha banner" class="logo-image w-full" />
    </div>
</section>
