<section class="flex justify-center items-center gap-14 bg-[#F2F2F2] px-6 py-4 lg:px-14 lg:py-6 h-[100vh]">
    <div class="absolute top-9 right-9 w-[340px] h-[340px] bg-[rgba(5,98,140,0.4)] blur-3xl rounded-bl-full"></div>
    <div class="info w-1/2 flex justify-center relative z-10">
        <div class="content w-5/6 flex flex-col">
            <form class="flex flex-col gap-8" [formGroup]="loginForm" (ngSubmit)="onSubmitData()">
                <div class="flex flex-col gap-3">
                    <div class="head flex justify-center items-center gap-4 lg:mt-3">
                        <h2 class="text-[22px] lg:text-[32px] font-bold text-black">مرحبا بك في </h2>
                        <div class="flex items-center gap-x-2 mt-1">
                            <span class="text-[22px] lg:text-3xl font-bold text-[#0f172a]">Flow<span
                                    class="text-[#1A5CFF]">Care</span></span>
                            <svg class="w-[30px] lg:w-[40px]"  viewBox="0 0 24 24" fill="none" stroke="#1A5CFF"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                                </path>
                                <path d="M3.5 12h4l2-4 3 8 2-5 1.5 3h4.5"></path>
                            </svg>
                        </div>
                    </div>
                    <p class="text-center text-[#474c55]">سجل الدخول برقم الواتساب، وسنرسل لك رمز تحقق.</p>
                </div>

                <div class="form-content flex flex-col gap-6">
                    <div class="user-name flex flex-col gap-2">
                        <label class="text-sm text-[#333333] font-normal">رقم الواتساب</label>
                        <input type="text" formControlName="phone"
                            class="w-full p-3 border border-[#F1F1F1] rounded-lg placeholder:text-base placeholder:text-[#B3B3B3] placeholder:font-normal focus:outline-none"
                            placeholder="أدخل رقم الواتساب الخاص بك" />
                    </div>
                </div>
                <button class="w-full rounded-lg py-2.5 px-3 bg-[#1053fc] text-white" type="submit"
                    [disabled]="loginForm.invalid || isLoading()">
                    @if (!isLoading()) {
                    <span>إرسال رمز التحقق</span>
                    } @else {
                    <span class="loading-content">
                        <span>جارٍ إرسال رمز التحقق...</span>
                        <span class="loading-spinner" aria-hidden="true"></span>
                    </span>
                    }
                </button>
                <p>هل انت دكتور او اسيستانت؟ <a routerLink="/auth/admin-login" class="text-[#1053fc] hover:underline">انقر هنا</a></p>
            </form>
        </div>
    </div>
    <div class="image w-1/2 relative z-10">
        <img src="assets/images/banner2.jpg" alt="flowCare banner" class="logo-image w-full" />
    </div>
</section>
